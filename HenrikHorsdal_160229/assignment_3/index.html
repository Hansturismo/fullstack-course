<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
        <link href="./css/reset.css" rel="stylesheet" />
        <link href="./css/variables.css" rel="stylesheet" />
        <link href="./css/fonts.css" rel="stylesheet" />
        <link href="./css/styles.css" rel="stylesheet" />
        <link href="./css/header.css" rel="stylesheet" />
        <link href="./css/playlists.css" rel="stylesheet" />
        <link href="./css/sidebar.css" rel="stylesheet" />
        <link href="./css/searchbar.css" rel="stylesheet" />
        <link href="./css/content.css" rel="stylesheet" />
        <link href="./css/footer.css" rel="stylesheet" />
        <script src="./js/songs.js" defer></script>
        <script src="./js/rendering.js" defer></script>
        <script src="./js/playlists.js" defer></script>
        <script src="./js/search.js" defer></script>
        <script src="./js/app.js" defer></script>
        <title>Audivio</title>
    </head>
    <body>
        <header>
            <h1 class="header-title">Audivio</h1>
            <div class="header-content"></div>
            <div class="header-content"></div>
        </header>
        <main>
            <div class="playlists__creation--desktop playlists--hide-desktop" id="createPlaylistDesktop" inert>
                    <form id="playlistCreationFormDesktop">
                        <label for="playlistName">Playlist name</label>
                        <input type="text" name="playlistName" id="playlistName"/>
                        <button type="submit" form="playlistCreationFormDesktop" value="Submit">Create</button>
                    </form>
                </div>
            <div class="sidebar">
                <div class="searchbar">
                    <label for="searchInputDesktop">Search for a song</label>
                    <input
                        type="text"
                        name="searchInputDesktop"
                        id="searchInputDesktop"
                        placeholder="Search for title, artist, genre..."
                    />
                </div>
                <div class="sidebar__divider"></div>
                <!-- Playlists for desktop -->
                <div class="playlists" id="playlistDesktop">
                    <div class="playlists__container">
                        <div class="playlists__header">
                            <h2>My Playlists</h2>
                            <button title="Create playlist" id="createPlaylistButtonDesktop" aria-label="Create playlist" >+</button>
                        </div>
                        <p>Your created playlists are displayed here.</p>
                    </div>
                    <!-- Playlists populated by locally stored array -->
                    <div class="playlists__list">
                    </div>
                </div>
            </div>
            <div class="content">
                <div class="content__results">
                    <div class="content__results-header">
                        <!-- Buttons to sort results and to act as a table head -->
                        <button id="sortByTitle" title="Click to sort" aria-label="Sort, title">Title</button>
                        <button id="sortByArtist" title="Click to sort" aria-label="Sort, artist">Artist</button>
                        <button id="sortByGenre" title="Click to sort" aria-label="Sort, genre">Genre</button>
                        <button id="sortByDuration">
                            <img src="./assets/icons/timer-svgrepo-com.svg" class="track__duration--icon"></img>
                        </button>
                        <div></div>
                    </div>
                    <div class="content__results-container"></div>
                </div>
                <div class="playlist-view playlist-view--hide" inert>
                    <div class="playlist-view__title">
                        <h2></h2>
                        <button class="playlist-view__close">Close</button>
                    </div>
                    <div class="playlist-view__header">
                        <button id="sortByTitle" title="Click to sort" aria-label="Sort, title">Title</button>
                        <button id="sortByArtist" title="Click to sort" aria-label="Sort, artist">Artist</button>
                        <button id="sortByGenre" title="Click to sort" aria-label="Sort, genre">Genre</button>
                        <button id="sortByDuration">
                            <img src="./assets/icons/timer-svgrepo-com.svg" class="track__duration--icon"></img>
                        </button>
                        <div></div>
                    </div>
                    <div class="playlist-view__tracks">
                        
                    </div>
                </div>
                <div class="playlist-selector playlist-selector--hide">
                    <div class="playlist-selector__backdrop"></div>
                    <div class="playlist-selector__view">
                        <div class="playlist-selector__controls">
                            <h2>Add to playlist</h2>
                            <button title="Cancel" aria-label="Cancel adding to playlist action">Cancel</button>
                        </div>
                        <div class="playlist-selector__list">
                            <div>1</div>
                            <div>2</div>
                        </div>
                     </div>
                </div>
                <!-- Playlists for mobile -->
                <div class="playlists playlists--hide-mobile" id="playlistsMobile" inert>
                    <div class="playlists__container">
                        <div class="playlists__header">
                            <h2>My Playlists</h2>
                            <button title="Create playlist" id="createPlaylistButtonMobile" aria-label="Create playlist">+</button>
                        </div>
                        <p>Your created playlists are displayed here.</p>
                    </div>
                    <!-- Playlists populated by locally stored array -->
                    <div class="playlists__list">
                    </div>
                </div>
                <div class="playlists__creation--mobile playlists--hide-mobile" id="createPlaylistMobile" inert>
                    <form id="playlistCreationFormMobile">
                        <label for="playlistName">Playlist name</label>
                        <input type="text" name="playlistName" id="playlistName"/>
                        <button type="submit" form="playlistCreationFormMobile" value="Submit">Add</button>
                    </form>
                </div>
                <div class="searchbar searchbar--hide" id="searchMenuMobile" inert>
                    <input
                        type="text"
                        name="searchInputMobile"
                        id="searchInputMobile"
                        placeholder="Search for title, artist, genre..."
                    />
                </div>
            </div>
        </main>
        <footer>
            <button id="openPlaylistsButton">Playlists</button>
            <button id="openSearchPromptButton">Search</button>
        </footer>
    </body>
</html>
