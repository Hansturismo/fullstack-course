<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="./css/reset.css" rel="stylesheet" />
        <link href="./css/variables.css" rel="stylesheet" />
        <link href="./css/styles.css" rel="stylesheet" />
        <link href="./css/header.css" rel="stylesheet" />
        <link href="./css/sidebar.css" rel="stylesheet" />
        <link href="./css/content.css" rel="stylesheet" />
        <link href="./css/footer.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
        <script src="./js/songs.js" defer></script>
        <script src="./js/rendering.js" defer></script>
        <script src="./js/playlists.js" defer></script>
        <script src="./js/search.js" defer></script>
        <script src="./js/app.js" defer></script>
        <title>Audivio</title>
    </head>
    <body>
        <header>
            <h1 class="header-title">Audivio</h1>
            <div class="header-content"></div>
            <div class="header-content"></div>
        </header>
        <main>
            <div class="sidebar">
                <div class="searchbar">
                    <label for="searchInput">Search for a song:</label>
                    <input
                        type="text"
                        name="searchInput"
                        id="searchInput"
                        placeholder="Search for title, artist, genre..."
                    />
                    <!-- Switch out for a search/magnyfying glass icon -->
                    <button id="searchButton">Search</button>
                </div>
                <div class="sidebar__divider"></div>
                <div class="playlists">
                    <div class="playlists-title">
                        <h2>My Playlists</h2>
                        <button title="Create playlist">+</button>
                        <p>Your created playlists are displayed here.</p>
                    </div>
                    <!-- Playlists populated by locally stored array -->
                    <div class="playlists-list">
                        <div>No playlists to show</div>
                    </div>
                </div>
            </div>
            <div class="content-wrapper">
                <!-- Area for selected song/playlist? -->
                <div class="content-selected"></div>
                <div class="results-wrapper">
                    <div class="results__grid-head">
                        <!-- Buttons to sort results and to act as a table head -->
                        <button id="sortByTitle" title="Click to sort">Title</button>
                        <button id="sortByArtist" title="Click to sort">Artist</button>
                        <button id="sortByGenre" title="Click to sort">Genre</button>
                        <button id="sortByDuration">Duration</button>
                    </div>
                    <div class="results-container"></div>
                </div>
                <div class="searchbar--mobile searchbar--show" id="searchMenuMobile">
                    <label for="searchInputMobile">Search for a song:</label>
                    <input type="text" name="searchInputMobile" id="searchInputMobile" />
                </div>
            </div>
        </main>
        <footer>
            <button id="openPlaylistsButton">Playlists</button>
            <button id="searchPromptButton">Search</button>
        </footer>
    </body>
</html>
