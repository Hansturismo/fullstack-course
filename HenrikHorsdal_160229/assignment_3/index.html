<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="./css/reset.css" rel="stylesheet" />
        <link href="./css/variables.css" rel="stylesheet" />
        <link href="./css/styles.css" rel="stylesheet" />
        <link href="./css/musicplayer.css" rel="stylesheet" />
        <link href="./css/header.css" rel="stylesheet" />
        <link href="./css/sidebar.css" rel="stylesheet" />
        <link href="./css/content.css" rel="stylesheet" />
        <link href="./css/footer.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
        <script src="./js/songs.js" defer></script>
        <script src="./js/playlists.js" defer></script>
        <script src="./js/app.js" defer></script>
        <title>Audivio</title>
    </head>
    <body>
        <header>
            <h1 class="header-title">Audivio</h1>
            <div class="header-content"></div>
            <div class="header-content"></div>
        </header>
        <main>
            <div class="sidebar">
                <div class="searchbar">
                    <label for="searchInput">Search for a song:</label>
                    <input
                        type="text"
                        name="searchInput"
                        id="searchInput"
                        placeholder="Search for title, artist, genre..."
                    />
                    <!-- Switch out for a search/magnyfying glass icon -->
                    <button>Search</button>
                </div>
                <div class="sidebar__divider"></div>
                <div class="playlists">
                    <div class="playlists-title">
                        <h2>My Playlists</h2>
                        <button title="Create playlist">+</button>
                        <p>Your created playlists are displayed here.</p>
                    </div>
                    <div class="playlists-list">
                        <!-- JavaScript could add this IF there's not saved playlists..? -->
                        <!-- <p class="no-playlists">No playlists.. why not make one?</p> -->
                        <div>Item 1</div>
                        <div>Item 1</div>
                        <div>Item 1</div>
                        <div>Item 1</div>
                        <div>Item 1</div>
                    </div>
                </div>
            </div>
            <div class="content-wrapper">
                <div class="content-selected"></div>
                <div class="content__divider"></div>
                <div class="grid-container">
                    <div class="track-info">
                        <p>Title</p>
                        <p>Artist</p>
                        <p>Genre</p>
                        <p>Duration</p>
                    </div>
                </div>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
