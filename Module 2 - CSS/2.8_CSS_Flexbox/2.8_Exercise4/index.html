<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Module 2 / lecture 4 / part 2 / exercise 4 -->
    <title>Restaurant Booking Form (Flexbox Exercise)</title>
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Restaurant Booking Form</h1>
      <p class="header__description">
        Fill out the form below to book a table at our restaurant.
      </p>
    </header>

    <main>
      <form class="form">
        <!-- Contact Information -->
        <fieldset class="form__group form__contact-group">
          <legend class="form__legend">Contact details</legend>
          <div class="form__input-group">
            <label for="fullname" class="form__label">Full Name:</label>
            <input
              class="form__input"
              type="text"
              id="fullname"
              name="fullname"
              required
              maxlength="50"
              placeholder="e.g. John Smith"
            />
          </div>
          <div class="form__input-group">
            <label for="email" class="form__label">Email Address:</label>
            <input
              class="form__input"
              type="email"
              id="email"
              name="email"
              placeholder="e.g. john@smith.com"
              required
            />
          </div>
          <div class="form__input-group">
            <label for="phone" class="form__label">Phone Number:</label>
            <input
              class="form__input"
              type="tel"
              id="phone"
              name="phone"
              placeholder="e.g. 12345678"
              pattern="[0-9]{8}"
              required
            />
          </div>
        </fieldset>

        <!-- Booking Details -->
        <fieldset class="form__group form__reservation-group">
          <legend class="form__legend">Reservation details</legend>
          <div class="form__input-group">
            <label for="date" class="form__label">Booking Date:</label>
            <input
              class="form__input"
              type="date"
              id="date"
              name="date"
              required
            />
          </div>
          <div class="form__input-group">
            <label for="time" class="form__label">Booking Time:</label>
            <input
              class="form__input"
              type="time"
              id="time"
              name="time"
              min="10:00"
              max="23:00"
              required
            />
          </div>
          <div class="form__input-group">
            <label for="guests" class="form__label">Number of Guests:</label>
            <input
              class="form__input"
              type="number"
              id="guests"
              name="guests"
              min="1"
              max="50"
              required
            />
          </div>
          <fieldset class="form__preferred-seating">
            <legend class="form__label">Preferred Seating Arrangement:</legend>
            <div>
              <input
                class="form__radio"
                type="radio"
                id="indoor"
                name="seating"
                value="indoor"
                required
              />
              <label for="indoor">Indoor</label>
            </div>
            <div>
              <input
                class="form__radio"
                type="radio"
                id="outdoor"
                name="seating"
                value="outdoor"
              />
              <label for="outdoor">Outdoor</label>
            </div>
            <div>
              <input
                class="form__radio"
                type="radio"
                id="private-room"
                name="seating"
                value="private-room"
              />
              <label for="private-room">Private Room</label>
            </div>
          </fieldset>

          <div class="form__input-group">
            <label for="special-requests" class="form__label">
              Special Requests:
            </label>
            <textarea
              class="form__textarea"
              id="special-requests"
              name="special-requests"
              placeholder="Type your request here..."
            ></textarea>
          </div>
        </fieldset>

        <!-- Payment Information -->
        <fieldset class="form__group form__payment-group">
          <legend class="form__legend">Payment details</legend>

          <label for="payment" class="form__label">Payment Method:</label>
          <select class="form__select" id="payment" name="payment" required>
            <option value="">Select Payment Method</option>
            <option value="credit-card">Credit Card</option>
            <option value="paypal">PayPal</option>
            <option value="vipps">Vipps</option>
          </select>
        </fieldset>

        <!-- Terms -->
        <div class="form__terms">
          <input
            class="form__checkbox"
            type="checkbox"
            id="terms"
            name="terms"
            required
          />
          <label for="terms" class="form__label">
            I agree to the
            <a href="#" class="form__link">terms and Conditions</a>
          </label>
        </div>

        <input class="form__submit" type="submit" value="Book Now" />
      </form>
    </main>
  </body>
</html>
