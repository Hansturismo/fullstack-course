<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
  </head>
  <!-- In the exercise folder, there's a image and draw.io file showing a visualisation of the DOM for this HTML file. -->
  <body>
    <header>
      <h1>My Portfolio</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Products</h2>
        <p>Product description</p>
        <button>Buy</button>
      </section>

      <section>
        <h2>Contact</h2>
        <form>
          <label for="email">Email</label>
          <input type="email" id="email" />
          <label for="message">Message</label>
          <textarea id="message"></textarea>
          <button>Send</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 My Portfolio</p>
    </footer>
  </body>
</html>
