<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>HTML Forms</h1>
    <h2>Radio Buttons</h2>

    <form>
      <input type="radio" name="age-range" id="under-18" value="under_18" />
      <label for="under-18">Under 18</label>
      <br />
      <input type="radio" name="age-range" id="18-25" value="18-25" />
      <label for="18-25">19-25</label>
      <br />
      <input type="radio" name="age-range" id="25+" value="above_25" />
      <label for="25+">Above 25</label>
    </form>
    <h2>Checkboxes</h2>
    <form>
      <input type="checkbox" name="horror" id="horror" value="horror" />
      <label for="horror">Horror</label>
      <br />
      <input type="checkbox" name="comedy" id="comedy" value="comedy" />
      <label for="comedy">Comedy</label>
      <br />
      <input type="checkbox" name="romance" id="romance" value="romance" />
      <label for="romance">Romance</label>

      <h2>Select element from list</h2>
      <select name="country" id="country">
        <option value="">Norway</option>
        <option value="">Denmark</option>
        <option value="">Finland</option>
        <option value="">Sweden</option>
      </select>
    </form>
    
  </body>
</html>
