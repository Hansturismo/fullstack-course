<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>JavaScript Module 7 — DOM Exercise</title>
  </head>

  <body>
    <main>
      <form class="student-form">
        <div class="student-form__field">
          <label class="student-form__label" for="student-name">
            Student Name
          </label>
          <input type="text" id="student-name" class="student-form__name" />
        </div>

        <div class="student-form__field">
          <label class="student-form__label" for="student-email">Email</label>
          <input type="email" id="student-email" class="student-form__email" />
        </div>

        <div class="student-form__field">
          <label class="student-form__label" for="student-course">
            Course
          </label>
          <select id="student-course" class="student-form__course">
            <option value="">Select a course</option>
            <option value="Frontend Development">Frontend Development</option>
            <option value="UI Design">UI Design</option>
            <option value="Backend Development">Backend Development</option>
          </select>
        </div>

        <button type="submit" class="student-form__button">
          Register Student
        </button>
      </form>

      <table class="student-table">
        <thead class="student-table__head">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
          </tr>
        </thead>

        <tbody class="student-table__body"></tbody>
      </table>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
