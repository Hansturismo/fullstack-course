<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>JS Intermediate | Lecture 1 | Exercise 10</title>
  </head>
  <body>
    <main class="main">
      <form class="product-form">
        <div class="product-form__group">
          <label for="product-name">Product Name</label>
          <input type="text" id="product-name" class="product-form__name" />
        </div>

        <div class="product-form__group">
          <label for="product-category">Category</label>
          <select id="product-category" class="product-form__category">
            <option value="">Select category</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Books">Books</option>
          </select>
        </div>

        <div class="product-form__group">
          <label for="product-price">Price</label>
          <input type="number" id="product-price" class="product-form__price" />
        </div>

        <button type="submit">Submit</button>
      </form>

      <div class="product-display">
        <h2 class="product-display__title">Product Details</h2>
        <p class="product-display__name"></p>
        <p class="product-display__category"></p>
        <p class="product-display__price"></p>
      </div>
    </main>
    <script src="./js/app.js"></script>
  </body>
</html>
